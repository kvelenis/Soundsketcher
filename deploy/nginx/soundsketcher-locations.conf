# Include these blocks inside the existing helen.mus.auth.gr server block.
#
# Existing public legacy app:
#   https://helen.mus.auth.gr/app1/ -> http://127.0.0.1:5002/
#
# New refactor app:
#   https://helen.mus.auth.gr/soundsketcher/ -> http://127.0.0.1:5013/
#
# Keep SOUNDSKETCHER_BASE_PATH="/soundsketcher" in the refactor .env when this
# subpath route is enabled.

# Static files served directly by nginx for the /soundsketcher/ subpath.
location ^~ /soundsketcher/sandbox-static/ {
    alias /mnt/ssd1/kvelenis/soundsketcher-staging/refactor_sandbox/static/;
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;
    access_log off;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

location ^~ /soundsketcher/static/ {
    alias /mnt/ssd1/kvelenis/soundsketcher-staging/refactor_sandbox/static/;
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;
    access_log off;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

location ^~ /soundsketcher/user_data/ {
    alias /mnt/ssd1/kvelenis/soundsketcher-staging/refactor_sandbox/runtime/user_data/;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

location ^~ /soundsketcher/static_uploads/ {
    alias /mnt/ssd1/kvelenis/soundsketcher-staging/static_uploads/;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

# Do not add a trailing slash to proxy_pass here.  The app receives
# /soundsketcher/... and strips that prefix internally.
location /soundsketcher/ {
    proxy_pass http://soundsketcher_refactor;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /soundsketcher;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    client_max_body_size 200M;
}
